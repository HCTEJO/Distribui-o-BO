<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Distrib. BO">
  <meta name="theme-color" content="#1a3a6b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Distribuição BO</title>
</head>
<body>

  <header id="header" style="display:none">
    <div>
      <h1 id="titulo">Distribuição BO</h1>
      <div class="sub" id="subtitulo"></div>
    </div>
    <button class="btn" onclick="recarregar()">↻</button>
  </header>

  <div id="main">
    <div class="loading">
      <div class="spinner"></div>
      <span>A carregar...</span>
    </div>
  </div>

  <nav id="bottom-nav" style="display:none"></nav>

  <script>
    var WEBAPP = "https://script.google.com/macros/s/AKfycbxvN_I4tVKeMRioMnqDXmJ8WbLPyQiyR_lbgl2wxkraJQS25M-ALlX0DJVmBiz6yJDx/exec";

    var tabActiva = null;

    function getTabParam() {
      return new URLSearchParams(window.location.search).get("tab") || "";
    }

    function carregarConteudo(tab) {
      tabActiva = tab || getTabParam() || null;
      var url = WEBAPP + (tabActiva ? "?tab=" + encodeURIComponent(tabActiva) : "");

      document.getElementById("main").innerHTML =
        "<div class='loading'><div class='spinner'></div><span>A carregar...</span></div>";
      document.getElementById("header").style.display = "none";
      document.getElementById("bottom-nav").style.display = "none";

      fetch(url)
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function(html) {
          var parser = new DOMParser();
          var doc    = parser.parseFromString(html, "text/html");

          // Título e subtítulo
          var h1  = doc.querySelector("header h1");
          var sub = doc.querySelector("header .sub");
          if (h1)  document.getElementById("titulo").textContent    = h1.textContent;
          if (sub) document.getElementById("subtitulo").textContent = sub.textContent;
          document.getElementById("header").style.display = "flex";

          // Tabela
          var scroll = doc.querySelector(".scroll");
          document.getElementById("main").innerHTML = scroll
            ? "<div class='scroll'>" + scroll.innerHTML + "</div>"
            : "<div class='scroll'>" + doc.body.innerHTML + "</div>";

          // Bottom nav — extrair lista de tabs do WebApp
          construirBottomNav(doc);
        })
        .catch(function(err) {
          document.getElementById("main").innerHTML =
            "<div class='card-erro'><h2>Distribuição BO</h2>" +
            "<p>Não foi possível carregar.<br><small>" + err.message + "</small></p></div>";
        });
    }

    function construirBottomNav(doc) {
      // O WebApp inclui os tabs disponíveis no elemento .tabs
      var tabsEl  = doc.querySelector(".tabs");
      var nav     = document.getElementById("bottom-nav");

      // Extrair tabs: tab activa + links de outras tabs
      var tabs = [];

      // Tab activa (vem no h1 do header)
      var h1 = doc.querySelector("header h1");
      if (h1) {
        var nomeActiva = h1.textContent.replace("Distribuicao ", "").trim();
        tabs.push({ nome: nomeActiva, activa: true });
      }

      // Outros tabs (links na barra .tabs)
      if (tabsEl) {
        tabsEl.querySelectorAll("a").forEach(function(a) {
          var nome = a.textContent.trim();
          if (nome) tabs.push({ nome: nome, activa: false });
        });
      }

      if (tabs.length <= 1) {
        nav.style.display = "none";
        return;
      }

      nav.innerHTML = tabs.map(function(t) {
        var cls = t.activa ? "nav-tab active" : "nav-tab";
        var onclick = t.activa ? "" : "onclick=\"carregarConteudo('" + t.nome + "')\"";
        return "<button class='" + cls + "' " + onclick + ">" +
               "<span class='nav-dia'>" + t.nome.split(" ").slice(0,2).join(" ") + "</span>" +
               "<span class='nav-mes'>" + t.nome.split(" ")[2] + "</span>" +
               "</button>";
      }).join("");

      nav.style.display = "flex";
      // Ajustar padding do main para nao ficar tapado pela nav
      document.getElementById("main").style.paddingBottom = "64px";
    }

    function recarregar() {
      carregarConteudo(tabActiva);
    }

    // Iniciar
    carregarConteudo(null);
  </script>

</body>
</html>
