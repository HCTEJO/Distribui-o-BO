<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Distrib. BO">
  <meta name="theme-color" content="#1a3a6b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Distribuição BO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a3a6b;
    }

    /* Splash enquanto o iframe carrega */
    #splash {
      position: fixed;
      inset: 0;
      background: #1a3a6b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      transition: opacity .4s ease;
    }

    #splash.oculto {
      opacity: 0;
      pointer-events: none;
    }

    #splash h1 {
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    #splash .sub {
      color: rgba(255,255,255,.6);
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Iframe a 100% */
    #frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Splash de carregamento -->
  <div id="splash">
    <div class="spinner"></div>
    <h1>Distribuição BO</h1>
    <div class="sub">Hospital CUF Tejo · Bloco Operatório</div>
  </div>

  <!-- Conteúdo do WebApp em iframe -->
  <iframe
    id="frame"
    src="https://script.google.com/macros/s/AKfycbxvN_I4tVKeMRioMnqDXmJ8WbLPyQiyR_lbgl2wxkraJQS25M-ALlX0DJVmBiz6yJDx/exec"
    onload="ocultarSplash()"
    allow="fullscreen">
  </iframe>

  <script>
    function ocultarSplash() {
      document.getElementById("splash").classList.add("oculto");
    }

    // Fallback: ocultar splash ao fim de 10s mesmo sem onload
    setTimeout(ocultarSplash, 10000);
  </script>

</body>
</html>
