<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Distrib. BO">
  <meta name="theme-color" content="#1a3a6b">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Distribuição BO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a3a6b;
      font-family: Arial, sans-serif;
    }

    /* Splash de carregamento */
    #splash {
      position: fixed;
      inset: 0;
      background: #1a3a6b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      transition: opacity .5s ease;
    }

    #splash.oculto {
      opacity: 0;
      pointer-events: none;
    }

    #splash h1 {
      color: white;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    #splash .sub {
      color: rgba(255,255,255,.55);
      font-size: 12px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Ajustar --escala: 0.80 = 20% menor, 0.75 = 25% menor */
    :root { --escala: 0.80; }

    #frame-wrap {
      width: 100%;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    #frame {
      border: none;
      display: block;
      background: white;
      width: calc(100% / var(--escala));
      height: calc(100% / var(--escala));
      transform: scale(var(--escala));
      transform-origin: top left;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="spinner"></div>
    <h1>Distribuição BO</h1>
    <div class="sub">Hospital CUF Tejo · Bloco Operatório</div>
  </div>

  <div id="frame-wrap">
    <iframe
      id="frame"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSor5hywrlcMWl-iHXAjRWEvWzZ67R35BVAes5rK58DeDR4r5CgJzgtHxhNdsA_Vl9XX6_01eOaYcuz/pubhtml"
      onload="ocultarSplash()"
      sandbox="allow-scripts allow-same-origin allow-popups"
      allow="fullscreen">
    </iframe>
  </div>

  <script>
    function ocultarSplash() {
      document.getElementById("splash").classList.add("oculto");
    }
    setTimeout(ocultarSplash, 8000);
  </script>

</body>
</html>
